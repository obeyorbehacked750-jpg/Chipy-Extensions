<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboWarp Extensions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>TurboWarp Extensions</h1>
            <div class="header-actions">
                <input type="text" id="search-input" placeholder="Search extensions..." class="search-bar">
                <button id="theme-toggle" class="btn btn-secondary">
                    <img id="theme-icon" src="assets/moon.png" width="20" height="20" alt="Theme Icon" class="btn-icon" onerror="this.style.display='none'">
                    <span id="theme-text">Dark Theme</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div id="gallery" class="gallery"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
